[tox]
envlist = py38,py39,py310,py311,py312,py313,py314,pkg
skip_missing_interpreters = true

[testenv]
description = Run the VascX pytest suite.
extras = test
package = editable
changedir = {tox_root}
setenv =
    MPLBACKEND = Agg
commands =
    pytest {posargs}

[testenv:public]
recreate = true
description = Run the same regression tests against a published PyPI installation.
package = skip
extras =
deps =
    pytest == 8.*
    pyarrow >= 14
    PyYAML == 6.*
changedir = {env_tmp_dir}
passenv =
    VASCX_VERSION
    HF_HOME
    HF_HUB_CACHE
    VASCX_MODEL_DIR
setenv =
    MPLBACKEND = Agg
    PYTHONPATH =
    VASCX_PUBLIC_TEST = 1
commands_pre =
    python {tox_root}/tests/prepare_public.py {env_tmp_dir}
commands =
    python -m pytest {posargs:-m "reference or cli_e2e"}
